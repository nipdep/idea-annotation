<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idea Annotator</title>
    <base href="{{BASE_PATH}}">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape one"></div>
    <div class="bg-shape two"></div>

    <header class="app-header">
      <div class="app-brand">
        <img class="app-logo" src="assets/icon.png" alt="Idea Annotator" />
        <div>
          <div class="app-title">Idea Annotator</div>
          <div class="app-subtitle">Annotate concepts and arguments with grounded evidence.</div>
        </div>
      </div>
    </header>

    <main class="app-grid">
      <aside class="left-stack">
        <section class="panel" id="uploadPanel">
          <div class="panel-header">
            <h2>Source File</h2>
          </div>
          <div class="upload-inline">
            <input type="file" id="pdfInput" accept="application/pdf" />
            <button id="uploadBtn">Upload</button>
          </div>
          <div id="paperInfo" class="muted"></div>
        </section>

        <section class="panel scrollable" id="metadataPanel">
          <div class="panel-header">
            <h2>Bibliographic Data</h2>
          </div>
          <div id="metadataForm" class="stack"></div>

          <div class="list-block">
            <div class="subhead">Concepts</div>
            <div id="conceptList" class="list"></div>
          </div>

          <div class="list-block">
            <div class="subhead">Arguments</div>
            <div id="argumentList" class="list"></div>
          </div>
        </section>

        <section class="panel" id="submitPanel">
          <div class="panel-header">
            <h2>Submission</h2>
          </div>
          <button id="submitBtn" class="primary">Submit Annotations</button>
        </section>
      </aside>

      <section class="panel doc-panel">
        <div class="panel-header">
          <h2>Document</h2>
        </div>
        <div id="docView" class="doc-view"></div>
        <div class="doc-actions">
          <button id="addHighlightBtn">Add Grounding</button>
          <span id="highlightHint" class="muted"></span>
        </div>
        <div class="list-block">
          <div class="subhead">Highlights</div>
          <div id="highlightList" class="list"></div>
        </div>
      </section>

      <section class="panel" id="annotatePanel">
        <div class="panel-header">
          <h2>Annotation Builder</h2>
        </div>

        <div class="guide">
          <div class="subhead">Suggested Flow</div>
          <div id="flowGuide" class="flow-list"></div>
        </div>

        <div class="tab-bar">
          <button class="tab active" data-tab="concept">Concept</button>
          <button class="tab" data-tab="argument">Argument</button>
        </div>

        <div id="conceptTab" class="tab-content active">
          <div class="stack">
            <label>Label <input id="conceptLabel" type="text" placeholder="e.g., Latent Dirichlet Allocation" /></label>
            <label>Aliases <input id="conceptAliases" type="text" placeholder="Comma-separated" /></label>
            <label>Category</label>
            <div id="conceptTypePicker" class="type-picker"></div>
            <div id="conceptTypePath" class="muted"></div>
            <div class="roles">
              <span>Roles</span>
              <label><input type="checkbox" value="argument_anchor" /> argument_anchor</label>
              <label><input type="checkbox" value="background" /> background</label>
            </div>
          </div>
          <div class="stack">
            <div class="subhead">Source refs</div>
            <div id="highlightPicker"></div>
          </div>
          <button id="addConceptBtn">Add Concept</button>
        </div>

        <div id="argumentTab" class="tab-content">
          <div class="stack">
            <label>Canonical Text
              <textarea id="argumentText" rows="4" placeholder="Minimal assertion..."></textarea>
            </label>
            <label>Type
              <select id="argumentType"></select>
            </label>
            <label>Concept refs
              <div id="argumentConceptRefs" class="tag-list"></div>
            </label>
          </div>
          <div class="stack">
            <div class="subhead">Source refs</div>
            <div id="highlightPickerArgument"></div>
          </div>
          <button id="addArgumentBtn">Add Argument</button>
        </div>

      </section>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
  </body>
</html>
